<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06070b"><title>NexGene</title><link rel="stylesheet" href="/static/styles.css"></head><body><div id="app"><div id="auth-view" class="view"><div class="card auth-card"><h1>NexGene</h1><p class="muted">Personal health intelligence</p><div class="tabs"><button id="tab-login" class="tab active">Sign in</button><button id="tab-register" class="tab">Create account</button></div><form id="login-form" class="form"><label>Email<input type="email" id="login-email" required autocomplete="username"></label><label>Password<input type="password" id="login-password" required autocomplete="current-password"></label><button type="submit" class="primary">Sign in</button><p id="login-error" class="error" hidden></p></form><form id="register-form" class="form" hidden><label>Email<input type="email" id="register-email" required autocomplete="username"></label><label>Password<input type="password" id="register-password" required autocomplete="new-password" minlength="10"></label><button type="submit" class="primary">Create account</button><p id="register-error" class="error" hidden></p></form></div></div><div id="app-view" class="view" hidden><header class="topbar"><div class="brand">NexGene</div><button id="btn-logout" class="ghost">Sign out</button></header><nav class="nav"><button data-panel="home" class="nav-btn active">Home</button><button data-panel="checkin" class="nav-btn">Check-in</button><button data-panel="insights" class="nav-btn">Insights</button><button data-panel="profile" class="nav-btn">Profile</button></nav><main id="panels"><section id="panel-home" class="panel"><div class="card"><h2>Today</h2><div id="home-summary" class="muted">Loading…</div></div><div class="card"><h2>Living baseline</h2><div id="home-baseline" class="muted">Loading…</div></div></section><section id="panel-checkin" class="panel" hidden><div class="card"><h2>Morning check-in</h2><form id="morning-form" class="form grid"></form><button id="btn-morning" class="primary">Save morning</button></div><div class="card"><h2>Evening check-in</h2><form id="evening-form" class="form grid"></form><button id="btn-evening" class="primary">Save evening</button></div></section><section id="panel-insights" class="panel" hidden><div class="card"><h2>Intelligence brief</h2><div id="insights-brief" class="muted">Loading…</div></div><div class="card"><h2>Patterns</h2><div id="insights-patterns" class="muted">Loading…</div></div></section><section id="panel-profile" class="panel" hidden><div class="card"><h2>Profile</h2><form id="profile-form" class="form"></form><button id="btn-profile" class="primary">Save profile</button></div></div></section></main></div></div><script src="/static/app.js"></script></body></html>
